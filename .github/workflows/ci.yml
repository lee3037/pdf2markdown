name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run pytest
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: uv run python scripts/package_gateway.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf2markdown-gateway-windows
          path: .local/pdf2markdown-gateway-windows.zip
          retention-days: 7
  gateway-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - run: uv run pytest backend/tests/test_gateway.py backend/tests/test_live_fixtures.py -q
      - name: Parse Windows deployment scripts
        shell: pwsh
        run: |
          Get-ChildItem gateway/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Set up isolated gateway environment
        shell: pwsh
        run: ./gateway/windows/setup.ps1
