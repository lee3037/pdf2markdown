[project]
name = "pdf2markdown"
version = "0.1.0"
description = "Local PDF to Markdown workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "pypdf>=6,<7",
  "filelock>=3.18,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
